<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>हिंदी चुटकुला जनरेटर</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <main class="app">
      <section class="card">
        <div class="header-row">
          <span class="badge">✨ मज़ा</span>
          <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">🌙</button>
        </div>

        <h1>हिंदी चुटकुला जनरेटर</h1>
        <p class="subtitle">आज का व्यंग्य या मज़ेदार समय</p>

        <div class="controls">
          <label for="category">श्रेणी चुनें</label>
          <select id="category">
            <option value="Any">सभी</option>
            <option value="Programming">प्रोग्रामिंग</option>
            <option value="Misc">मिश्र</option>
            <option value="Dark">डार्क</option>
            <option value="Pun">पुन</option>
            <option value="Spooky">भूतिया</option>
            <option value="Christmas">क्रिसमस</option>
          </select>
        </div>

        <div class="button-row">
          <button id="generateBtn" class="primary-btn">अगला मज़ा</button>
          <button id="copyBtn" class="secondary-btn">कॉपी करें</button>
        </div>

        <div id="jokeBox" class="joke-box" aria-live="polite">
          एक मज़ेदार चुटकुला लोड हो रहा है...
        </div>

        <div class="meta-row">
          <span id="categoryTag" class="tag">सभी</span>
          <span id="statusText" class="status">तैयार</span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
